#!/usr/sbin/nft -f
# Pare-feu nftables de l'hôte Vigie (alternative à ufw.sh). À copier dans /etc/nftables.conf
# puis : systemctl enable --now nftables. Adapter le port SSH.
#
# Docker gère ses propres tables (ip nat / ip filter, chaîne DOCKER) : NE PAS utiliser
# « flush ruleset » ici, cela effacerait les règles de Docker jusqu'à son redémarrage. Seule la
# table « inet vigie » est (re)créée. Les ports publiés par Docker (80, 443, 853) traversent la
# chaîne FORWARD, pas INPUT : ils sont rappelés ci-dessous pour mémoire et pour l'IPv6.

table inet vigie
delete table inet vigie

table inet vigie {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    tcp dport 22 ct state new limit rate 10/minute accept   # SSH
    tcp dport { 80, 443, 853 } accept                        # Caddy, DoT (si proxy userland/IPv6)
    # udp dport 51820 accept                                 # WireGuard (profil optionnel)
  }
  chain forward {
    type filter hook forward priority 0; policy accept;
    # Docker filtre lui-même le trafic vers les conteneurs (chaînes DOCKER / DOCKER-USER).
  }
}

# Exemple : restreindre le DNS-over-TLS (853) à un réseau mobile donné, dans DOCKER-USER
# (table ip filter, gérée par Docker, consultée avant ses propres règles) :
#   iptables -I DOCKER-USER -p tcp --dport 853 ! -s 203.0.113.0/24 -j DROP
# (non persistant : à placer dans un service systemd lancé après docker.service)
