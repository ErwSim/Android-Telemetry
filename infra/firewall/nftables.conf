#!/usr/sbin/nft -f
# nftables firewall of the Watchpost host (alternative to ufw.sh). Copy it to /etc/nftables.conf
# then: systemctl enable --now nftables. Adapt the SSH port.
#
# Docker manages its own tables (ip nat / ip filter, DOCKER chain): DO NOT use
# "flush ruleset" here, it would erase Docker's rules until Docker restarts. Only the
# "inet watchpost" table is (re)created. The ports published by Docker (80, 443, 853) go through
# the FORWARD chain, not INPUT: they are listed below as a reminder and for IPv6.

table inet watchpost
delete table inet watchpost

table inet watchpost {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    meta l4proto { icmp, ipv6-icmp } accept
    tcp dport 22 ct state new limit rate 10/minute accept   # SSH
    tcp dport { 80, 443, 853 } accept                        # Caddy, DoT (with userland proxy/IPv6)
    # udp dport 51820 accept                                 # WireGuard (optional profile)
  }
  chain forward {
    type filter hook forward priority 0; policy accept;
    # Docker filters the traffic to the containers itself (DOCKER / DOCKER-USER chains).
  }
}

# Example: restrict DNS-over-TLS (853) to a given mobile network, in DOCKER-USER
# (ip filter table, managed by Docker, evaluated before its own rules):
#   iptables -I DOCKER-USER -p tcp --dport 853 ! -s 203.0.113.0/24 -j DROP
# (not persistent: put it in a systemd service started after docker.service)
