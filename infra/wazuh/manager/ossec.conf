<!--
  Wazuh manager: Watchpost configuration (single node, NO remote Wazuh agent).
  Copied to /var/ossec/etc/ossec.conf on every container start (/wazuh-config-mount).
  Derived from wazuh-docker v4.14.10 single-node/config/wazuh_cluster/wazuh_manager.conf:
  - <remote> limited to 127.0.0.1, <auth> protected by a random password (1514/1515 not published);
  - inventory/vulnerability modules of the manager container disabled (useless here, costly);
  - logall_json: ALL events go to archives.json, then to wazuh-archives-*;
  - sources: NDJSON export of the Watchpost collector, AdGuard Home query log,
    silence/sequence gap watcher (watchpost_watch.py).
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>16</email_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <sca>
    <enabled>no</enabled>
  </sca>

  <vulnerability-detection>
    <enabled>no</enabled>
    <index-status>no</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://wazuh.indexer:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/ssl/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/ssl/filebeat.pem</certificate>
      <key>/etc/ssl/filebeat.key</key>
    </ssl>
  </indexer>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <!-- No remote Wazuh agent. wazuh-remoted refuses to start without a <remote> block: here it
       listens only on the container's loopback (unreachable, port not published). -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <local_ip>127.0.0.1</local_ip>
  </remote>

  <!-- Agent enrollment: wazuh-control requires wazuh-authd to run. It is reachable only on the
       internal Docker network (1515 not published) and requires a random password
       (etc/authd.pass, created by watchpost-init.sh): no agent can enroll. -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_password>yes</use_password>
    <purge>yes</purge>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
  </auth>

  <!-- ===================== Watchpost sources ===================== -->

  <!-- NDJSON export of the collector (contract §5). watchpost_export volume mounted read-only.
       only-future-events=no: after a manager restart, reading resumes at the last position read
       (nothing is lost as long as the file has not rotated more than once in between). -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/watchpost/events.ndjson</location>
    <only-future-events>no</only-future-events>
  </localfile>

  <!-- AdGuard Home query log (NDJSON, rotated by renaming to querylog.json.1). -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/adguard/querylog.json</location>
    <only-future-events>no</only-future-events>
  </localfile>

  <!-- Watchpost watcher: silence of a device and sequence gaps (rules 1003xx). -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>watchpost-watch</tag>
    <command>/var/ossec/framework/python/bin/python3 /watchpost/watch/watchpost_watch.py</command>
    <interval>10m</interval>
    <run_on_start>yes</run_on_start>
    <timeout>120</timeout>
    <ignore_output>no</ignore_output>
  </wodle>

  <!-- Disk space of the manager (rule 531 if a partition goes above 90%). -->
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>3600</frequency>
  </localfile>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <!-- Private DNS host(s) expected on the phone (generated by install.sh) -->
    <list>etc/lists/watchpost-private-dns-hosts</list>

    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>64</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>

  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key>00000000000000000000000000000000</key>
    <port>1516</port>
    <bind_addr>127.0.0.1</bind_addr>
    <nodes>
      <node>wazuh.manager</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>
  </cluster>
</ossec_config>
