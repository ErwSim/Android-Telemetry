<!--
  Wazuh manager — configuration Vigie (nœud unique, AUCUN agent Wazuh distant).
  Copié dans /var/ossec/etc/ossec.conf à chaque démarrage du conteneur (/wazuh-config-mount).
  Dérivé de wazuh-docker v4.14.10 single-node/config/wazuh_cluster/wazuh_manager.conf :
  - <remote> limité à 127.0.0.1, <auth> protégé par mot de passe aléatoire (1514/1515 non publiés) ;
  - modules d'inventaire/vulnérabilités du conteneur manager désactivés (sans intérêt ici, coûteux) ;
  - logall_json : TOUS les événements vont dans archives.json puis dans wazuh-archives-* ;
  - sources : export NDJSON du collecteur Vigie, journal des requêtes AdGuard Home,
    sonde de silence/trous de séquence (vigie_watch.py).
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>yes</logall_json>
    <email_notification>no</email_notification>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>16</email_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="osquery">
    <disabled>yes</disabled>
  </wodle>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <sca>
    <enabled>no</enabled>
  </sca>

  <vulnerability-detection>
    <enabled>no</enabled>
    <index-status>no</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://wazuh.indexer:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/ssl/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/ssl/filebeat.pem</certificate>
      <key>/etc/ssl/filebeat.key</key>
    </ssl>
  </indexer>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <!-- Pas d'agent Wazuh distant. wazuh-remoted refuse de démarrer sans bloc <remote> : il
       n'écoute ici que sur la boucle locale du conteneur (injoignable, port non publié). -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <local_ip>127.0.0.1</local_ip>
  </remote>

  <!-- Enrôlement d'agents : wazuh-control exige que wazuh-authd tourne. Il n'est joignable que
       sur le réseau Docker interne (1515 non publié) et exige un mot de passe aléatoire
       (etc/authd.pass, créé par vigie-init.sh) : aucun agent ne peut s'enrôler. -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_password>yes</use_password>
    <purge>yes</purge>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
  </auth>

  <!-- ===================== Sources Vigie ===================== -->

  <!-- Export NDJSON du collecteur (contrat §5). Volume vigie_export monté en lecture seule.
       only-future-events=no : après un redémarrage du manager, reprise à la dernière position lue
       (rien n'est perdu tant que le fichier n'a pas tourné plus d'une fois entre-temps). -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/vigie/events.ndjson</location>
    <only-future-events>no</only-future-events>
  </localfile>

  <!-- Journal des requêtes AdGuard Home (NDJSON, rotation par renommage en querylog.json.1). -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/adguard/querylog.json</location>
    <only-future-events>no</only-future-events>
  </localfile>

  <!-- Sonde Vigie : silence d'un appareil et trous de séquence (règles 1003xx). -->
  <wodle name="command">
    <disabled>no</disabled>
    <tag>vigie-watch</tag>
    <command>/var/ossec/framework/python/bin/python3 /vigie/watch/vigie_watch.py</command>
    <interval>10m</interval>
    <run_on_start>yes</run_on_start>
    <timeout>120</timeout>
    <ignore_output>no</ignore_output>
  </wodle>

  <!-- Espace disque du manager (règle 531 si une partition dépasse 90 %). -->
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>3600</frequency>
  </localfile>

  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <!-- Hôte(s) DNS privé(s) attendu(s) sur le téléphone (généré par install.sh) -->
    <list>etc/lists/vigie-private-dns-hosts</list>

    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>64</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>

  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key>00000000000000000000000000000000</key>
    <port>1516</port>
    <bind_addr>127.0.0.1</bind_addr>
    <nodes>
      <node>wazuh.manager</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>
  </cluster>
</ossec_config>
