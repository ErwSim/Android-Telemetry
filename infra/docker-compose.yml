# Watchpost: server stack (VPS with 8 GB+). Do not start it directly the first time: use
# ./install.sh, which generates .env, the secrets, the certificates and the configuration files.
#
# Exposed on the Internet: 80/tcp and 443/tcp (Caddy), 853/tcp (AdGuard Home DNS-over-TLS),
# 51820/udp only with the "wireguard" profile. Nothing else (no 1514/1515/55000/9200).
#
# Memory (limits, not reservations): indexer 2 GB heap + 1 GB off-heap, manager 1.5 GB,
# dashboard 1 GB, AdGuard 768 MB, collector 512 MB, Caddy 256 MB. See README.

name: watchpost

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # ------------------------------------------------------------------------------------------
  caddy:
    image: ${WATCHPOST_CADDY_IMAGE:-caddy:2.11.9-alpine}
    restart: unless-stopped
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      WATCHPOST_DOMAIN: ${WATCHPOST_DOMAIN:?}
      WATCHPOST_TLS_MODE: ${WATCHPOST_TLS_MODE:-acme}
      WATCHPOST_ACME_EMAIL: ${WATCHPOST_ACME_EMAIL:-}
      WATCHPOST_ADMIN_ALLOW: ${WATCHPOST_ADMIN_ALLOW:-0.0.0.0/0 ::/0}
      WATCHPOST_ACME_DNS_TOKEN: ${WATCHPOST_ACME_DNS_TOKEN:-}
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./data/caddy:/etc/caddy-generated:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      watchpost:
        ipv4_address: ${WATCHPOST_CADDY_IP:-172.31.250.10}
    depends_on:
      collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    logging: *logging

  # ------------------------------------------------------------------------------------------
  collector:
    build:
      context: ../server
    image: watchpost-collector:local
    restart: unless-stopped
    <<: *hardening
    cap_drop: [ALL]
    command: ["serve"]
    environment:
      WATCHPOST_LISTEN: ":8080"
      WATCHPOST_DATA_DIR: /data
      WATCHPOST_EXPORT_NDJSON: /export/events.ndjson
      WATCHPOST_EXPORT_MAX_BYTES: ${WATCHPOST_EXPORT_MAX_BYTES:-52428800}
      WATCHPOST_EXPORT_KEEP: ${WATCHPOST_EXPORT_KEEP:-5}
      # Only Caddy (fixed address on the internal network) may set X-Watchpost-Client-Cert-Sha256.
      WATCHPOST_TRUSTED_PROXIES: ${WATCHPOST_CADDY_IP:-172.31.250.10}/32
      WATCHPOST_REQUIRE_CLIENT_CERT: "true"
      WATCHPOST_PUBLIC_INGEST_URL: https://ingest.${WATCHPOST_DOMAIN:?}
      WATCHPOST_PRIVATE_DNS_HOST: ${WATCHPOST_PRIVATE_DNS_HOST:-}
      WATCHPOST_SERVER_CA_FILE: ${WATCHPOST_SERVER_CA_FILE:-}
      WATCHPOST_RETENTION_DAYS: ${WATCHPOST_RETENTION_DAYS:-90}
      WATCHPOST_COOKIE_SECURE: "true"
      WATCHPOST_WAZUH_INDEXER_URL: https://wazuh.indexer:9200
      WATCHPOST_WAZUH_INDEXER_USER: watchpost_reader
      WATCHPOST_WAZUH_INDEXER_PASSWORD: ${WAZUH_READER_PASSWORD:?}
      WATCHPOST_WAZUH_INDEXER_CA_FILE: /etc/watchpost/wazuh-root-ca.pem
      WATCHPOST_TILE_URL: ${WATCHPOST_TILE_URL:-}
      WATCHPOST_LOG_LEVEL: ${WATCHPOST_LOG_LEVEL:-info}
      # Remote commands (contract §8): keepalive of the agents' SSE stream.
      WATCHPOST_CMD_KEEPALIVE_S: ${WATCHPOST_CMD_KEEPALIVE_S:-120}
      # Tracking page (contract §9): AdGuard Home API over the internal network only, with the
      # "watchpost-collector" account (administrator: AdGuard has a single account type).
      WATCHPOST_ADGUARD_URL: http://adguardhome:3000
      WATCHPOST_ADGUARD_USER: watchpost-collector
      WATCHPOST_ADGUARD_PASSWORD: ${ADGUARD_COLLECTOR_PASSWORD:?}
      WATCHPOST_ADGUARD_LEVELS_FILE: /etc/watchpost/adguard-levels.json
      WATCHPOST_ADGUARD_POLL_S: ${WATCHPOST_ADGUARD_POLL_S:-60}
      WATCHPOST_ADGUARD_CLIENTS: ${WATCHPOST_ADGUARD_CLIENTS:-}
      # Detections (contract §11.3): empty = collector defaults (infra/README.md §7.4). They
      # cross net.dns with the blocks of the "category: threat" lists of levels.json.
      WATCHPOST_DETECT_ENABLED: ${WATCHPOST_DETECT_ENABLED:-}
      WATCHPOST_DETECT_DISABLE: ${WATCHPOST_DETECT_DISABLE:-}
      WATCHPOST_DETECT_INTERVAL_S: ${WATCHPOST_DETECT_INTERVAL_S:-}
      WATCHPOST_DETECT_UPLOAD_FLOOR_MB: ${WATCHPOST_DETECT_UPLOAD_FLOOR_MB:-}
      WATCHPOST_DETECT_UPLOAD_FACTOR: ${WATCHPOST_DETECT_UPLOAD_FACTOR:-}
      WATCHPOST_DETECT_UPLOAD_LEARN_DAYS: ${WATCHPOST_DETECT_UPLOAD_LEARN_DAYS:-}
      WATCHPOST_DETECT_FANOUT: ${WATCHPOST_DETECT_FANOUT:-}
      WATCHPOST_DETECT_FANOUT_SCREEN_OFF: ${WATCHPOST_DETECT_FANOUT_SCREEN_OFF:-}
      WATCHPOST_DETECT_MAIL_MIN: ${WATCHPOST_DETECT_MAIL_MIN:-}
      WATCHPOST_DETECT_MAIL_CLIENTS: ${WATCHPOST_DETECT_MAIL_CLIENTS:-}
      WATCHPOST_DETECT_DNS_BYPASS_MIN: ${WATCHPOST_DETECT_DNS_BYPASS_MIN:-}
      WATCHPOST_DETECT_DNS_BYPASS_PORTS: ${WATCHPOST_DETECT_DNS_BYPASS_PORTS:-}
      WATCHPOST_DETECT_DNS_BYPASS_EXEMPT: ${WATCHPOST_DETECT_DNS_BYPASS_EXEMPT:-}
      WATCHPOST_DETECT_SMS_OTHER_MIN: ${WATCHPOST_DETECT_SMS_OTHER_MIN:-}
      WATCHPOST_DETECT_SMS_DAILY_MAX: ${WATCHPOST_DETECT_SMS_DAILY_MAX:-}
      WATCHPOST_DETECT_MIC_BG_MIN: ${WATCHPOST_DETECT_MIC_BG_MIN:-}
      WATCHPOST_DETECT_CAMERA_BG_MIN: ${WATCHPOST_DETECT_CAMERA_BG_MIN:-}
    volumes:
      - collector_data:/data
      - watchpost_export:/export
      - ./secrets/wazuh-certs/root-ca.pem:/etc/watchpost/wazuh-root-ca.pem:ro
      - ./data/caddy:/etc/watchpost/caddy:ro
      # Blocking levels: same file as the one that builds the AdGuard lists (install.sh).
      - ./adguard/levels.json:/etc/watchpost/adguard-levels.json:ro
    networks: [watchpost]
    healthcheck:
      test: ["CMD", "/usr/local/bin/watchpost-collector", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    logging: *logging

  # ------------------------------------------------------------------------------------------
  adguardhome:
    image: adguard/adguardhome:v0.107.80
    restart: unless-stopped
    <<: *hardening
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, CHOWN, FOWNER, DAC_OVERRIDE]
    # Waits until Caddy has obtained the dns.<domain> certificate before starting (otherwise
    # DoT is not enabled).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        i=0; until [ -s "$$WATCHPOST_AGH_CERT" ]; do
        i=$$((i+1)); [ $$i -gt 300 ] && { echo "certificate $$WATCHPOST_AGH_CERT missing" >&2; exit 1; };
        sleep 2; done;
        exec /opt/adguardhome/AdGuardHome --no-check-update
        -c /opt/adguardhome/conf/AdGuardHome.yaml -w /opt/adguardhome/work
    environment:
      WATCHPOST_AGH_CERT: ${WATCHPOST_AGH_CERT_PATH:?}
    ports:
      - "853:853/tcp"
    volumes:
      - ./data/adguard/conf:/opt/adguardhome/conf
      - adguard_work:/opt/adguardhome/work
      - adguard_querylog:/opt/adguardhome/querylog
      - ./adguard:/opt/adguardhome/work/userfilters/watchpost:ro
      - ./data/adguard/userfilters:/opt/adguardhome/work/userfilters/personal:ro
      # Only the directory of the DNS certificate (not Caddy's other keys).
      - type: volume
        source: caddy_data
        target: /certs
        read_only: true
        volume:
          subpath: ${WATCHPOST_AGH_CERT_SUBPATH:?}
    networks:
      watchpost:
        ipv4_address: ${WATCHPOST_ADGUARD_IP:-172.31.250.53}
    depends_on:
      caddy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login.html && nc -z 127.0.0.1 853"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 768m
    logging: *logging

  # ------------------------------------------------------------------------------------------
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.10
    hostname: wazuh.indexer
    restart: unless-stopped
    <<: *hardening
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms${WAZUH_INDEXER_HEAP:-2g} -Xmx${WAZUH_INDEXER_HEAP:-2g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./secrets/wazuh-certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./secrets/wazuh-certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./secrets/wazuh-certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./secrets/wazuh-certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./secrets/wazuh-certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./wazuh/indexer/opensearch.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./data/wazuh/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    networks: [watchpost]
    healthcheck:
      # Authentication with the admin certificate: no password in the configuration.
      test: ["CMD-SHELL", "curl -s --cacert config/certs/root-ca.pem --cert config/certs/admin.pem --key config/certs/admin-key.pem https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: ${WAZUH_INDEXER_MEM_LIMIT:-3g}
    logging: *logging

  # ------------------------------------------------------------------------------------------
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.10
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_ADMIN_PASSWORD:?}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?}
      WATCHPOST_PRIVATE_DNS_HOSTS: ${WATCHPOST_PRIVATE_DNS_HOSTS:-}
      WATCHPOST_WATCH_SILENCE_MIN: ${WATCHPOST_WATCH_SILENCE_MIN:-60}
      WATCHPOST_ARCHIVES_FILE_DAYS: ${WATCHPOST_ARCHIVES_FILE_DAYS:-14}
      # Optional notifications (README §8.5): disabled if the URL and the SMTP server are empty.
      WATCHPOST_NOTIFY_URL: ${WATCHPOST_NOTIFY_URL:-}
      WATCHPOST_NOTIFY_TOPIC: ${WATCHPOST_NOTIFY_TOPIC:-}
      WATCHPOST_NOTIFY_TOKEN: ${WATCHPOST_NOTIFY_TOKEN:-}
      WATCHPOST_NOTIFY_LEVEL: ${WATCHPOST_NOTIFY_LEVEL:-10}
      WATCHPOST_NOTIFY_SMTP_HOST: ${WATCHPOST_NOTIFY_SMTP_HOST:-}
      WATCHPOST_NOTIFY_SMTP_PORT: ${WATCHPOST_NOTIFY_SMTP_PORT:-587}
      WATCHPOST_NOTIFY_SMTP_TLS: ${WATCHPOST_NOTIFY_SMTP_TLS:-starttls}
      WATCHPOST_NOTIFY_SMTP_USER: ${WATCHPOST_NOTIFY_SMTP_USER:-}
      WATCHPOST_NOTIFY_SMTP_PASSWORD: ${WATCHPOST_NOTIFY_SMTP_PASSWORD:-}
      WATCHPOST_NOTIFY_SMTP_FROM: ${WATCHPOST_NOTIFY_SMTP_FROM:-}
      WATCHPOST_NOTIFY_SMTP_TO: ${WATCHPOST_NOTIFY_SMTP_TO:-}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      # Volumes expected by the image's initialisation script (without them, a mere container
      # restart interrupts the initialisation before the configuration is copied).
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./secrets/wazuh-certs/root-ca.pem:/etc/ssl/root-ca.pem:ro
      - ./secrets/wazuh-certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./secrets/wazuh-certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./wazuh/manager/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./wazuh/rules:/wazuh-config-mount/etc/rules:ro
      - ./wazuh/manager/entrypoint-scripts:/entrypoint-scripts:ro
      - ./wazuh/manager/cont-init/00-watchpost-pre:/etc/cont-init.d/00-watchpost-pre:ro
      - ./wazuh/watch:/watchpost/watch:ro
      - ./wazuh/notify:/watchpost/notify:ro
      - ./wazuh/tests:/watchpost/tests:ro
      - watchpost_export:/var/watchpost:ro
      - adguard_querylog:/var/adguard:ro
    networks: [watchpost]
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running' && /var/ossec/bin/wazuh-control status | grep -q 'wazuh-logcollector is running'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: ${WAZUH_MANAGER_MEM_LIMIT:-1536m}
    logging: *logging

  # ------------------------------------------------------------------------------------------
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.10
    hostname: wazuh.dashboard
    restart: unless-stopped
    <<: *hardening
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_ADMIN_PASSWORD:?}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:?}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${WAZUH_API_PASSWORD:?}
      NODE_OPTIONS: --max-old-space-size=${WAZUH_DASHBOARD_NODE_HEAP_MB:-640}
    volumes:
      - ./secrets/wazuh-certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./secrets/wazuh-certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./secrets/wazuh-certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./wazuh/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./data/wazuh/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh_dashboard_custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks: [watchpost]
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -o /dev/null -w '%{http_code}' https://localhost:5601/api/status | grep -qE '^(200|401)$'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    mem_limit: ${WAZUH_DASHBOARD_MEM_LIMIT:-1g}
    logging: *logging

  # ------------------------------------------------------------------------------------------
  # Option: WireGuard tunnel ("wireguard" profile). See README: significant drawbacks.
  wireguard:
    profiles: ["wireguard"]
    image: ghcr.io/wg-easy/wg-easy:15
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      INIT_ENABLED: "true"
      INIT_USERNAME: admin
      INIT_PASSWORD: ${WG_ADMIN_PASSWORD:-}
      INIT_HOST: wg.${WATCHPOST_DOMAIN:?}
      INIT_PORT: "51820"
      INIT_DNS: ${WATCHPOST_ADGUARD_IP:-172.31.250.53}
      # Web interface reachable only through an SSH tunnel (127.0.0.1:51821): no TLS.
      INSECURE: "true"
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    volumes:
      - wireguard_data:/etc/wireguard
    networks:
      watchpost:
        # Fixed address: the only internal address allowed by AdGuard in ClientID mode.
        ipv4_address: ${WATCHPOST_WG_IP:-172.31.250.20}
    mem_limit: 256m
    logging: *logging

networks:
  watchpost:
    driver: bridge
    ipam:
      config:
        - subnet: ${WATCHPOST_SUBNET:-172.31.250.0/24}

volumes:
  caddy_data:
  caddy_config:
  collector_data:
  watchpost_export:
  adguard_work:
  adguard_querylog:
  wazuh_indexer_data:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh_dashboard_custom:
  wireguard_data:
