# Shared machine: keep the daemon small.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1g

# Vigie build parameters (override with -P on the command line).
# android:testOnly="true" keeps "adb shell dpm remove-active-admin" working (requires "adb install -t").
vigie.testOnly=true
vigie.versionCode=1
vigie.versionName=0.1.0
