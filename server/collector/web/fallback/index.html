<h1>Watchpost</h1>
<p>The collector is running, but the web console was not embedded in this binary.</p>
<p>Build <code>server/console</code>, then copy <code>server/console/dist/</code> into
<code>server/collector/web/dist/</code> before <code>go build</code>, or set
<code>WATCHPOST_CONSOLE_DIR</code>. The API stays available under <code>/api/console/</code>.</p>
