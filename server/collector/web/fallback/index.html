<p>Le collecteur fonctionne, mais la console web n'a pas été intégrée à ce binaire.</p>
<p>Construisez <code>server/console</code> puis copiez <code>server/console/dist/</code> dans
<code>server/collector/web/dist/</code> avant <code>go build</code>, ou définissez
<code>WATCHPOST_CONSOLE_DIR</code>. L'API reste disponible sous <code>/api/console/</code>.</p>
